[project]
name = "lasse-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3",
    "django-vite-tags",
    "wagtail-umami-analytics",
    "gunicorn>=26.0.0",
    "psycopg>=3.3.4",
    "pymemcache>=4.0.0",
    "sentry-sdk>=2.61.0",
    "wagtail>=7.4,<8.0",
    "pygments>=2.20.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.19",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=6.3.0",
    "django-pattern-library>=1.5.0",
    "django-upgrade>=1.29.1",
    "djhtml>=3.0.11",
    "honcho>=2.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.15.15",
    "time-machine>=3.2.0",
    "wagtail-factories>=4.3.0",
]
playwright = [
    "pytest-playwright>=0.8.0",
]

[tool.uv]
exclude-newer = "P2D"
exclude-newer-package = { django = false, wagtail = false }

[tool.uv.sources]
django-vite-tags = { git = "https://github.com/lasse-cs/django-vite-tags.git", rev = "a69aabf0c10a45bcaa0e6f9cc2f44b4d1d7548fa" }
wagtail-umami-analytics = { git = "https://github.com/lasse-cs/wagtail-umami-analytics.git", rev = "a5f518f401cf686318e1c15cea3d4d401a60f1ed" }

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]


[tool.pytest]
addopts = ["--reuse-db"]
DJANGO_SETTINGS_MODULE = "blog.settings.test"
pythonpath = ["src"]
python_files = ["**/tests/test_*.py", "**/functional_tests/test_*.py"]
